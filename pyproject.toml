[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercheck"
version = "0.1.0"
description = "API and worker for defensive security assessments of Python projects"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "python-dotenv>=1,<2",
  "bandit>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cybercheck = "cybercheck.__main__:main"

[tool.setuptools.packages.find]
include = ["cybercheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
